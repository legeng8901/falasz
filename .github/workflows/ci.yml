# Continuous integration for the Falasz interpreter.
# Prepared locally; it runs only once the repository is pushed to GitHub.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - name: Check that text files were checked out with LF
        shell: bash
        run: |
          if grep -rlI $'\r' tests/spec_examples examples; then
            echo "CRLF found: .gitattributes is not being applied" >&2
            exit 1
          fi

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest -ra

  package:
    name: package install (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: test
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build wheel and sdist
        run: |
          python -m pip install build
          python -m build

      - name: Install the wheel into a clean virtual environment
        shell: bash
        run: |
          # Git Bash on Windows: use a POSIX-style path for RUNNER_TEMP.
          TEMP_DIR="$RUNNER_TEMP"
          if command -v cygpath > /dev/null; then TEMP_DIR="$(cygpath -u "$RUNNER_TEMP")"; fi
          python -m venv "$RUNNER_TEMP/clean"
          if [ -d "$TEMP_DIR/clean/Scripts" ]; then BIN="$TEMP_DIR/clean/Scripts"; else BIN="$TEMP_DIR/clean/bin"; fi
          "$BIN/python" -m pip install dist/*.whl
          "$BIN/python" -c "from importlib.metadata import metadata as m; assert m('falasz')['License-Expression'] == 'MIT'"
          echo "TEMP_DIR=$TEMP_DIR" >> "$GITHUB_ENV"
          echo "BIN=$BIN" >> "$GITHUB_ENV"

      - name: Smoke-test the installed command outside the source tree
        shell: bash
        run: |
          cd "$TEMP_DIR"
          test "$("$BIN/falasz" --version)" = "falasz 0.1.0a0"
          cp -r "$GITHUB_WORKSPACE/examples" ex
          cd ex
          "$BIN/falasz" check notes/main.falasz
          "$BIN/falasz" run fizzbuzz.falasz | diff - fizzbuzz.out
          "$BIN/falasz" run --sensors-mock thermostat.sensors.json thermostat.falasz | diff - thermostat.out
          "$BIN/falasz" run stats.falasz < stats.in | diff - stats.out
          (cd weather && "$BIN/falasz" run --sensors-mock main.sensors.json main.falasz | diff - main.out)
          (cd budget && "$BIN/falasz" run main.falasz | diff - main.out)
          set +e
          "$BIN/falasz" run error_trace.falasz > /dev/null 2>&1
          test $? -eq 1 || { echo "expected exit code 1"; exit 1; }
          "$BIN/falasz" run missing.falasz > /dev/null 2>&1
          test $? -eq 2 || { echo "expected exit code 2"; exit 1; }

      # What docs/getting-started.md recommends: pipx puts "falasz" on PATH, so
      # it runs without naming any virtual environment.
      - name: Install with pipx and run "falasz" from PATH
        shell: bash
        run: |
          pipx install --python python dist/*.whl
          cd "$TEMP_DIR/ex"
          command -v falasz || { echo "falasz is not on PATH (PIPX_BIN_DIR=$PIPX_BIN_DIR)"; exit 1; }
          test "$(falasz --version)" = "falasz 0.1.0a0"
          falasz run grades.falasz < grades.in | diff - grades.out
