# Continuous integration for the Falasz interpreter.
# Prepared locally; it runs only once the repository is pushed to GitHub.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - name: Check that text files were checked out with LF
        shell: bash
        run: |
          if grep -rlI $'\r' tests/spec_examples examples; then
            echo "CRLF found: .gitattributes is not being applied" >&2
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest -ra

  package:
    name: package install (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build wheel and sdist
        run: |
          python -m pip install build
          python -m build

      - name: Install the wheel into a clean virtual environment
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/clean"
          if [ -d "$RUNNER_TEMP/clean/Scripts" ]; then BIN="$RUNNER_TEMP/clean/Scripts"; else BIN="$RUNNER_TEMP/clean/bin"; fi
          "$BIN/python" -m pip install dist/*.whl
          echo "BIN=$BIN" >> "$GITHUB_ENV"

      - name: Smoke-test the installed command outside the source tree
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          test "$("$BIN/falasz" --version)" = "falasz 0.1.0a0"
          cp -r "$GITHUB_WORKSPACE/examples" ex
          cd ex
          "$BIN/falasz" check notes/main.falasz
          "$BIN/falasz" run fizzbuzz.falasz | diff - fizzbuzz.out
          "$BIN/falasz" run --sensors-mock thermostat.sensors.json thermostat.falasz | diff - thermostat.out
          "$BIN/falasz" run stats.falasz < stats.in | diff - stats.out
          (cd weather && "$BIN/falasz" run --sensors-mock main.sensors.json main.falasz | diff - main.out)
          set +e
          "$BIN/falasz" run error_trace.falasz > /dev/null 2>&1
          test $? -eq 1 || { echo "expected exit code 1"; exit 1; }
          "$BIN/falasz" run missing.falasz > /dev/null 2>&1
          test $? -eq 2 || { echo "expected exit code 2"; exit 1; }
