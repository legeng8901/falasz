[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "falasz"
dynamic = ["version"]
description = "Falasz programming language - reference interpreter (alpha)"
readme = "README.md"
requires-python = ">=3.12"
keywords = ["programming language", "interpreter", "education"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Interpreters",
]
# No license or author metadata yet: the owner decides before publication.

[project.optional-dependencies]
dev = ["pytest>=8", "build>=1"]

[project.scripts]
falasz = "falasz.cli:entry_point"

[tool.setuptools.dynamic]
version = { attr = "falasz.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
